spring.application.name=BookStore
spring.datasource.url=jdbc:mysql://${DB_HOST:...}:${DB_PORT:...}/${DB_NAME:...}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:...}
spring.datasource.password=${DB_PASSWORD:...}

# Config ORM properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Key
jwt_secret=${JWT_SECRET:...}

# Config image
project.image=${UPLOAD_IMAGE:...}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Config Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


# Config Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:...@gmail.com}
spring.mail.password=${MAIL_PASSWORD:...}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
nameEmail=BookStore

# Config Google
google.client.id=${GOOGLE_CLIENT_ID:...}
# Config Ship
tokenIdShip=${TOKEN_ID_SHIP:...}
idShip=${ID_SHIP:...}

# Config Redis
spring.data.redis.host=${REDIS_HOST:...}
spring.data.redis.port=${REDIS_PORT:...}
spring.data.redis.password=${REDIS_PASSWORD:...}

spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.data.redis.client-type=jedis
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=2
spring.data.redis.jedis.pool.max-wait=PT1S
# spring.redis.notify-keyspace-events=Ex

# Config VNPay
vnpay.secretKey=${VNPAY_SECRETKEY:...}
vnpay.vnp_TmnCode=${VNPAY_VNP_TMN_CODE:...}
vnpay.vnp_ReturnUrl=${VNPAY_VNP_RETURN_URL:...}


# debug logs
logging.level.org.springframework.security=debug


spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

logging.level.org.springframework.transaction=DEBUG



fontend.urlVerify=${URL_VERIFY:...}

ghn.base.url=${GHN_BASE_URL:...}

ghn.token=${GHN_TOKEN:...}

ghn.shop_id=${GHN_SHOP_ID:...}


spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

